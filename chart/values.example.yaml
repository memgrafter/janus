# Example values for a longhorn + metallb k3s cluster.
#
# Mirrors a real instantiation; cluster-specific values (registry, metallb IP)
# are placeholders — replace them for your cluster.
#
# Prereqs (create once in the target namespace):
#   kubectl -n <ns> create secret generic janus-inference-control-plane-token \
#     --from-literal=token=<bearer-token>
#   kubectl -n <ns> create secret generic janus-inference-control-plane-keys \
#     --from-literal=openai=$OPENAI_API_KEY \
#     --from-literal=deepseek=$DEEPSEEK_API_KEY \
#     --from-literal=openrouter=$OPENROUTER_API_KEY
#   # ClinePass: the Cline CLI's credential file (from a machine where you ran
#   # `cline auth cline-pass`):
#   kubectl -n <ns> create secret generic janus-inference-control-plane-cline \
#     --from-file=providers.json=$HOME/.cline/data/settings/providers.json
#
# Install:
#   helm install janus-inference-control-plane ./chart/ \
#     -f chart/values.example.yaml \
#     -n janus-inference-control-plane --create-namespace

image:
  repository: __REGISTRY__/janus-inference-control-plane   # your registry host
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: LoadBalancer
  port: 8787
  loadBalancerIP: "<METALLB_IP>"   # pin a metallb IP from your pool (or "" to auto-assign)

persistence:
  enabled: true
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: 256Mi   # holds auth.json + providers.json (~KB each) + lockfiles
  mountPath: /data

auth:
  existingSecret: janus-inference-control-plane-token
  tokenKey: token

# ClinePass: enable to serve cline-pass/* models from the Cline credential
# secret above. Seeded into the PVC on first start only if absent.
cline:
  enabled: true
  existingSecret: janus-inference-control-plane-cline

apiKeys:
  - name: OPENAI_API_KEY
    secret: janus-inference-control-plane-keys
    key: openai
  - name: DEEPSEEK_API_KEY
    secret: janus-inference-control-plane-keys
    key: deepseek
  - name: OPENROUTER_API_KEY
    secret: janus-inference-control-plane-keys
    key: openrouter

catalog:
  enabled: false   # enable for custom providers (vllm, etc.)
