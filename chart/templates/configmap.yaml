{{- if and .Values.catalog.enabled (not .Values.catalog.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "janus-inference-control-plane.fullname" . }}
  labels:
    {{- include "janus-inference-control-plane.labels" . | nindent 4 }}
data:
  models.json: |
    {{- .Values.catalog.modelsJson | nindent 4 }}
{{- end }}
