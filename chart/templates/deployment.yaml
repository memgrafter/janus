apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "janus-inference-control-plane.fullname" . }}
  labels:
    {{- include "janus-inference-control-plane.labels" . | nindent 4 }}
{{- if and .Values.cline.enabled (not .Values.persistence.enabled) }}
{{- fail "cline.enabled requires persistence.enabled: the Cline credential file (providers.json) must be writable and persistent so pi-janus can write back rotated refresh tokens" }}
{{- end }}
spec:
  # 1 replica: the auth store uses a local advisory lockfile (proper-lockfile),
  # which is unsafe across multiple replicas sharing the PVC (advisory locks are
  # unreliable on networked/CSI filesystems -> refresh-token double-spend).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "janus-inference-control-plane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "janus-inference-control-plane.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      {{- if or .Values.persistence.enabled .Values.auth.existingAuthSecret .Values.cline.enabled }}
      initContainers:
        {{- if .Values.persistence.enabled }}
        - name: fix-permissions
          image: busybox:latest
          command: ["sh", "-c", "chown -R 65532:65532 {{ .Values.persistence.mountPath }} 2>/dev/null || chmod -R 777 {{ .Values.persistence.mountPath }}"]
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        {{- if .Values.auth.existingAuthSecret }}
        - name: seed-auth
          image: busybox:latest
          command: ["sh", "-c", "cp /auth/auth.json {{ .Values.persistence.mountPath }}/auth.json && chown 65532:65532 {{ .Values.persistence.mountPath }}/auth.json"]
          volumeMounts:
            - name: auth-seed
              mountPath: /auth
              readOnly: true
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        {{- if .Values.cline.enabled }}
        # Seed the Cline credential into the PVC ONLY IF ABSENT. pi-janus refreshes
        # the token and writes rotated tokens back to providers.json, so after the
        # first seed the PVC is the source of truth. Re-copying on every start would
        # clobber a live rotated token with the (stale) Secret snapshot -> double-spend
        # -> logout. To push a fresh login in, delete the PVC's providers.json (or the
        # whole PVC) and restart, or kubectl cp over it.
        - name: seed-cline
          image: busybox:latest
          command: ["sh", "-c", "if [ ! -f {{ .Values.persistence.mountPath }}/providers.json ]; then cp /cline/providers.json {{ .Values.persistence.mountPath }}/providers.json; fi && chown 65532:65532 {{ .Values.persistence.mountPath }}/providers.json"]
          volumeMounts:
            - name: cline-seed
              mountPath: /cline
              readOnly: true
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
      {{- end }}
      containers:
        - name: proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: JANUS_PORT
              value: {{ .Values.service.port | quote }}
            {{- if .Values.persistence.enabled }}
            - name: JANUS_AUTH_JSON
              value: {{ .Values.persistence.mountPath }}/auth.json
            {{- end }}
            {{- if .Values.cline.enabled }}
            - name: JANUS_CLINE_PASS
              value: "1"
            - name: JANUS_CLINE_PROVIDERS_JSON
              value: {{ .Values.persistence.mountPath }}/providers.json
            {{- end }}
            {{- if .Values.auth.noLock }}
            - name: JANUS_AUTH_NO_LOCK
              value: "1"
            {{- end }}
            {{- if .Values.catalog.enabled }}
            - name: JANUS_MODELS_JSON
              value: /etc/janus-inference-control-plane/models.json
            {{- end }}
            {{- if .Values.auth.existingSecret }}
            - name: JANUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.tokenKey }}
            {{- end }}
            {{- range .Values.apiKeys }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secret }}
                  key: {{ .key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          {{- if or .Values.persistence.enabled .Values.catalog.enabled }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.catalog.enabled }}
            - name: catalog
              mountPath: /etc/janus-inference-control-plane
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.enabled .Values.catalog.enabled .Values.auth.existingAuthSecret .Values.cline.enabled }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "janus-inference-control-plane.fullname" . }}-pvc
        {{- end }}
        {{- if .Values.catalog.enabled }}
        - name: catalog
          configMap:
            name: {{ .Values.catalog.existingConfigMap | default (include "janus-inference-control-plane.fullname" .) }}
        {{- end }}
        {{- if .Values.auth.existingAuthSecret }}
        - name: auth-seed
          secret:
            secretName: {{ .Values.auth.existingAuthSecret }}
        {{- end }}
        {{- if .Values.cline.enabled }}
        - name: cline-seed
          secret:
            secretName: {{ .Values.cline.existingSecret }}
        {{- end }}
      {{- end }}
